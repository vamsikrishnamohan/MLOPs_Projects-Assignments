version: '3.8'

services:
  db:
    build: ./database
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-news_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - app_network
    restart: unless-stopped

  rss-reader:
    build: ./rss-reader
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-news_db}
      - RSS_FEED_URL=${RSS_FEED_URL:-https://www.thehindu.com/news/national/?service=rss}
      - POLL_INTERVAL=${POLL_INTERVAL:-600}
      - IMAGES_DIR=/app/images
    volumes:
      - image_data:/app/images
    networks:
      - app_network
    depends_on:
      - db
    restart: unless-stopped

  web-app:
    build: ./web-app
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-news_db}
      - IMAGES_DIR=/app/images
    volumes:
      - image_data:/app/images:ro  # Read-only access to the images
    ports:
      - "${WEB_PORT:-8080}:8080"
    networks:
      - app_network
    depends_on:
      - db
      - rss-reader
    restart: unless-stopped

networks:
  app_network:
    driver: bridge

volumes:
  db_data:
  image_data: